version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - contextcheck
    - durationcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - prealloc
    - revive
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        - G204
        - G304
        - G702
        - G703
  exclusions:
    presets:
      - comments
    rules:
      - path: _test\.go
        linters:
          - gosec
      - linters:
          - gosec
        text: G101
        source: "providers\\.Traits\\{"

formatters:
  enable:
    - gofumpt
    - goimports
