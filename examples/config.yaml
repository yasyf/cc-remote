repository: https://github.com/<org>/<repo>
ref: main
provider: sprites
profile: lean

providers:
  sprites:
    org: <sprites-org>
  namespace:
    endpoint: https://us.compute.namespaceapis.com
    platform: linux/amd64
    exportPort: 18766
    volumeSizeGB: 125
    duration: 4h
    callTimeout: 60s
    readyTimeout: 10m

workspace_dirs:
  sprites: /home/sprite
  namespace: /workspaces

profiles:
  lean:
    checkout: shallow
    machine:
      sprites: {}
      namespace: { image: <registry/repository@sha256:digest>, size: 8x16 }
  full:
    checkout: full
    prepare:
      - ./tools/bootstrap-project.sh
      - ./tools/install-project-deps.sh
    machine:
      namespace: { image: <registry/repository@sha256:digest>, size: 16x32 }

inventory: ./inventory.yaml

forwards:
  - { label: example, env: EXAMPLE_PORT }


tailnet:
  tag: tag:cc-remote
  keychain_service: cc-remote-tailnet
  api: https://api.tailscale.com/api/v2

git:
  token_command: [gh, auth, token]
