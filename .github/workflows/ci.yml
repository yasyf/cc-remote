name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Render the example inventory and the closure fixture
        run: |
          for profile in agents stack; do
            go run ./cmd/cc-remote images render --inventory examples/inventory.yaml --profile "$profile" --out "$RUNNER_TEMP/images/$profile"
          done
          awk '/^image:/ { skip = 1; next } skip && /^[^ \t]/ { skip = 0 } !skip' examples/inventory.yaml > "$RUNNER_TEMP/closure-inventory.yaml"
          go run ./cmd/cc-remote images render --inventory "$RUNNER_TEMP/closure-inventory.yaml" --profile agents --out "$RUNNER_TEMP/images/closure"
      - name: bash -n
        run: |
          for script in "$RUNNER_TEMP"/images/*/*.sh "$RUNNER_TEMP"/images/*/namespace/*.sh; do
            bash -n "$script"
          done
      - name: shellcheck
        run: shellcheck "$RUNNER_TEMP"/images/*/*.sh "$RUNNER_TEMP"/images/*/namespace/*.sh
      - name: Compile the service supervisor
        run: python3 -m py_compile images/supervise.py

  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
